<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | Apex Games
    </title>

    <link
        rel="stylesheet"
        href="forgot-password.css?v=1"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <a
                href="login.html"
                class="back-link"
            >
                ← Back to Login
            </a>

            <p class="eyebrow">
                APEX GAMES
            </p>

            <h1>
                Forgot Password?
            </h1>

            <p class="description">
                Enter the email connected
                to your Apex Games account.
                We'll send you a password
                reset link.
            </p>

            <form id="forgotPasswordForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <button
                    type="submit"
                    id="sendButton"
                >
                    Send Reset Link
                </button>

            </form>

            <p
                id="formMessage"
                class="form-message"
            ></p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="forgot-password.js?v=1"></script>

</body>

</html>
