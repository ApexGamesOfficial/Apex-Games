<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Apex Games</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="account.css">
</head>

<body>

    <!-- NAVIGATION -->

    <header class="navbar">

        <a href="index.html" class="brand">
            <img src="assets/apex-logo.png" alt="Apex Games">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="library.html">Library</a>
            <a href="store.html">Store</a>
            <a href="news.html">News</a>
            <a href="about.html">About</a>
        </nav>

        <a href="login.html" class="discord-button">
            Log In
        </a>

    </header>


    <!-- LOGIN -->

    <main class="account-page">

        <section class="account-box">

            <div class="account-heading">

                <p class="account-label">
                    APEX GAMES ACCOUNT
                </p>

                <h1>Welcome Back</h1>

                <p>
                    Log in to access your Apex Games Library,
                    ratings, favorites, and connected experiences.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot-password">
                        Forgot password?
                    </a>

                </div>


                <p class="form-message" id="formMessage"></p>


                <button type="submit" class="account-submit">
                    LOG IN
                </button>

            </form>


            <div class="account-bottom">

                <p>
                    Don't have an Apex Games account?
                </p>

                <a href="signup.html">
                    Create Account
                </a>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
