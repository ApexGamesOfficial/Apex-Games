<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05070b"
    >

    <title>Chat | Apex Games</title>

    <link
        rel="stylesheet"
        href="chat.css?v=2"
    >
</head>

<body class="chat-loading">

    <!-- =====================================================
         CHAT LOADING SCREEN
    ====================================================== -->

    <div
        class="chat-loader"
        id="chatLoader"
        role="status"
        aria-live="polite"
    >

        <div class="chat-loader-background"></div>

        <div class="chat-loader-content">

            <div class="chat-loader-logo-wrap">

                <div class="chat-loader-ring"></div>

                <img
                    src="apex-logo.png"
                    alt="Apex Games"
                    class="chat-loader-logo"
                >

            </div>


            <div class="chat-loader-brand">
                APEX GAMES
            </div>

            <h1>
                Apex Chat
            </h1>

            <p id="chatLoaderStatus">
                Loading Apex Chat
            </p>


            <div
                class="chat-loader-dots"
                aria-hidden="true"
            >
                <span></span>
                <span></span>
                <span></span>
            </div>


            <div
                class="chat-loader-progress"
                aria-hidden="true"
            >
                <span></span>
            </div>


            <button
                type="button"
                id="chatLoaderRetry"
                class="chat-loader-retry"
                hidden
            >
                Retry
            </button>

        </div>

    </div>



    <!-- =====================================================
         TOP NAVIGATION
    ====================================================== -->

    <header class="topbar">

        <a
            href="index.html"
            class="brand"
            aria-label="Apex Games Home"
        >

            <img
                src="apex-logo.png"
                alt=""
                class="brand-logo"
            >

            <span class="brand-name">
                APEX GAMES
            </span>

        </a>


        <nav
            class="main-nav"
            aria-label="Main navigation"
        >

            <a href="index.html">
                Home
            </a>

            <a href="library.html">
                Library
            </a>

            <a
                href="chat.html"
                class="active"
            >
                Chat
            </a>

            <a href="store.html">
                Store
            </a>

            <a href="news.html">
                News
            </a>

            <a href="about.html">
                About
            </a>

        </nav>


        <div class="nav-right">

            <a
                href="profile.html"
                class="account-button"
                id="accountButton"
            >

                <div class="account-avatar-wrap">

                    <img
                        src="Default Apex Games Profile Picture.png"
                        alt=""
                        id="accountAvatar"
                        class="account-avatar"
                    >

                    <span
                        id="accountPresence"
                        class="account-presence offline"
                    ></span>

                </div>


                <span
                    id="accountGamertag"
                    class="account-gamertag"
                >
                    Account
                </span>

            </a>

        </div>

    </header>



    <!-- =====================================================
         CHAT APP
    ====================================================== -->

    <main
        class="chat-shell"
        id="chatShell"
    >

        <!-- =================================================
             CONVERSATIONS / FRIENDS
        ================================================== -->

        <aside class="conversations-panel">

            <div class="conversations-heading">

                <div>

                    <span class="eyebrow">
                        APEX GAMES
                    </span>

                    <h1>
                        Chat
                    </h1>

                </div>


                <button
                    type="button"
                    id="newChatButton"
                    class="new-chat-button"
                    aria-label="Start a conversation"
                    title="Start a conversation"
                >
                    +
                </button>

            </div>


            <div class="search-wrap">

                <svg
                    class="search-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M11 4a7 7 0 1 0 4.9 12L21 21"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </svg>

                <input
                    type="search"
                    id="friendSearch"
                    placeholder="Search friends..."
                    autocomplete="off"
                    aria-label="Search friends"
                >

            </div>


            <div class="friends-label">

                <span>
                    Friends
                </span>

                <span
                    class="friend-count"
                    id="friendCount"
                >
                    0
                </span>

            </div>


            <div
                class="friends-list"
                id="friendsList"
            >

                <div class="list-state">
                    Loading friends...
                </div>

            </div>

        </aside>



        <!-- =================================================
             CONVERSATION AREA
        ================================================== -->

        <section class="conversation-panel">

            <!-- =============================================
                 EMPTY STATE
            ============================================== -->

            <div
                class="conversation-empty"
                id="conversationEmpty"
            >

                <div class="empty-mark">

                    <img
                        src="apex-logo.png"
                        alt=""
                    >

                </div>


                <h2>
                    Apex Chat
                </h2>


                <p>
                    Select a friend to start a conversation.
                </p>


                <div class="empty-features">

                    <span>
                        Direct Messages
                    </span>

                    <span>
                        Live Presence
                    </span>

                    <span>
                        Apex Accounts
                    </span>

                </div>

            </div>



            <!-- =============================================
                 ACTIVE CONVERSATION
            ============================================== -->

            <div
                class="conversation"
                id="conversation"
                hidden
            >

                <!-- HEADER -->

                <header class="conversation-header">

                    <div class="conversation-header-left">

                        <button
                            type="button"
                            class="conversation-back"
                            id="conversationBack"
                            aria-label="Back to conversations"
                        >
                            ←
                        </button>


                        <div class="conversation-avatar-wrap">

                            <img
                                src="Default Apex Games Profile Picture.png"
                                alt=""
                                id="conversationAvatar"
                                class="conversation-avatar"
                            >

                            <span
                                id="conversationStatus"
                                class="presence-dot offline"
                            ></span>

                        </div>


                        <div class="conversation-info">

                            <h2 id="conversationName">
                                Friend
                            </h2>

                            <span
                                id="conversationStatusText"
                                class="conversation-presence"
                            >
                                Offline
                            </span>

                        </div>

                    </div>


                    <div class="conversation-actions">

                        <button
                            type="button"
                            id="voiceCallButton"
                            class="conversation-action"
                            title="Voice call"
                            aria-label="Voice call"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M6.7 3.5 9 8 7.2 9.8c1.4 3 3.8 5.4 6.8 6.8l1.8-1.8 4.5 2.3v3c0 .6-.4 1-1 1C10.2 21.1 2.9 13.8 2.9 4.7c0-.6.4-1 1-1h2.8Z"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linejoin="round"
                                />

                            </svg>

                        </button>


                        <button
                            type="button"
                            id="conversationMoreButton"
                            class="conversation-action more-button"
                            title="Conversation options"
                            aria-label="Conversation options"
                        >
                            •••
                        </button>

                    </div>

                </header>



                <!-- MESSAGES -->

                <div
                    class="messages"
                    id="messages"
                    aria-live="polite"
                ></div>



                <!-- FEATURE NOTICE -->

                <div
                    class="feature-notice"
                    id="featureNotice"
                    hidden
                >

                    <span id="featureNoticeText"></span>

                    <button
                        type="button"
                        id="closeFeatureNotice"
                        aria-label="Close"
                    >
                        ×
                    </button>

                </div>



                <!-- EMOJI PICKER -->

                <div
                    class="emoji-picker"
                    id="emojiPicker"
                    hidden
                >

                    <div class="emoji-header">

                        <strong>
                            Emoji
                        </strong>

                        <span>
                            Select one
                        </span>

                    </div>


                    <div
                        class="emoji-grid"
                        id="emojiGrid"
                    ></div>

                </div>



                <!-- COMPOSER -->

                <div class="composer">

                    <div class="composer-tools">

                        <button
                            type="button"
                            id="emojiButton"
                            class="composer-tool"
                            title="Emoji"
                            aria-label="Emoji"
                        >
                            ☺
                        </button>


                        <button
                            type="button"
                            id="gifButton"
                            class="composer-tool gif-button"
                            title="GIF"
                        >
                            GIF
                        </button>

                    </div>


                    <form
                        id="messageForm"
                        class="message-form"
                    >

                        <textarea
                            id="messageInput"
                            rows="1"
                            maxlength="2000"
                            placeholder="Message..."
                            aria-label="Message"
                        ></textarea>


                        <button
                            type="submit"
                            id="sendButton"
                            class="send-button"
                            disabled
                        >
                            Send
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         SUPABASE + APEX
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="auth.js"></script>

    <script src="presence.js?v=1"></script>

    <script src="chat.js?v=2"></script>

</body>

</html>
