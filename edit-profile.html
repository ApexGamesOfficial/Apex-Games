<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Apex Games</title>

    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="edit-profile.css?v=1">
</head>

<body>

    <header class="topbar">

        <div class="nav-left">

            <a href="index.html" class="brand">
                <img src="apex-logo.png" alt="Apex Games">
            </a>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="library.html">Library</a>
                <a href="chat.html">Chat</a>
                <a href="store.html">Store</a>
                <a href="news.html">News</a>
                <a href="about.html">About</a>
            </nav>

        </div>

        <form class="nav-search" id="navSearch">
            <span class="search-icon">⌕</span>

            <input
                type="search"
                placeholder="Search Apex Games"
                aria-label="Search Apex Games"
            >
        </form>

        <div class="nav-account">

            <a
                href="profile.html"
                class="profile-widget"
                id="profileWidget"
            >
                <img
                    src="Default Apex Games Profile Picture.png"
                    alt="Profile Picture"
                    id="profilePicture"
                >

                <span id="profileGamertag">
                    Player
                </span>
            </a>

        </div>

    </header>


    <main class="edit-profile-page">

        <div class="edit-profile-container">

            <div class="edit-profile-heading">
                <p>PROFILE</p>
                <h1>Edit Profile</h1>
                <span>
                    Customize how you appear across Apex Games.
                </span>
            </div>


            <form id="editProfileForm">

                <section class="edit-card">

                    <div class="avatar-section">

                        <img
                            src="Default Apex Games Profile Picture.png"
                            alt="Profile Picture"
                            id="avatarPreview"
                            class="avatar-preview"
                        >

                        <div class="avatar-info">

                            <h2>Profile Picture</h2>

                            <p>
                                Upload a custom image for your Apex Games profile.
                            </p>

                            <label
                                for="avatarInput"
                                class="upload-button"
                            >
                                Choose Image
                            </label>

                            <input
                                type="file"
                                id="avatarInput"
                                accept="image/png,image/jpeg,image/webp"
                                hidden
                            >

                            <span
                                class="avatar-file-name"
                                id="avatarFileName"
                            >
                                No image selected
                            </span>

                        </div>

                    </div>

                </section>


                <section class="edit-card">

                    <div class="field-group">

                        <label for="displayName">
                            Display Name
                        </label>

                        <input
                            type="text"
                            id="displayName"
                            maxlength="32"
                            placeholder="Display name"
                        >

                        <span class="field-help">
                            This is the name other players will see first.
                        </span>

                    </div>


                    <div class="field-group">

                        <label for="gamertag">
                            Gamertag
                        </label>

                        <input
                            type="text"
                            id="gamertag"
                            disabled
                        >

                        <span class="field-help">
                            Gamertag changing will be added later.
                        </span>

                    </div>


                    <div class="field-group">

                        <label for="bio">
                            Bio
                        </label>

                        <textarea
                            id="bio"
                            maxlength="180"
                            placeholder="Tell people a little about yourself..."
                        ></textarea>

                        <div class="bio-counter">
                            <span id="bioCount">0</span>/180
                        </div>

                    </div>

                </section>


                <div
                    class="form-message"
                    id="formMessage"
                ></div>


                <div class="edit-actions">

                    <a
                        href="profile.html"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="save-button"
                        id="saveButton"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="edit-profile.js?v=2"></script>

</body>

</html>
