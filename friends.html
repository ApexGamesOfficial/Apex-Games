<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friends | Apex Games</title>

    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="friends.css?v=1">
</head>

<body>

    <header class="topbar">

        <div class="nav-left">

            <a href="index.html" class="brand">
                <img src="apex-logo.png" alt="Apex Games">
            </a>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="library.html">Library</a>
                <a href="chat.html">Chat</a>
                <a href="store.html">Store</a>
                <a href="news.html">News</a>
                <a href="about.html">About</a>
            </nav>

        </div>

        <form class="nav-search">
            <span class="search-icon">⌕</span>

            <input
                type="search"
                placeholder="Search Apex Games"
            >
        </form>

        <div class="nav-account">

            <div
                class="logged-out-account"
                id="loggedOutAccount"
            >
                <a href="login.html" class="login-link">
                    Log In
                </a>

                <a
                    href="signup.html"
                    class="create-account-button"
                >
                    Create Account
                </a>
            </div>

            <a
                href="profile.html"
                class="profile-widget"
                id="profileWidget"
                hidden
            >
                <img
                    src="Default Apex Games Profile Picture.png"
                    alt="Profile Picture"
                    id="profilePicture"
                >

                <span id="profileGamertag">
                    Player
                </span>
            </a>

        </div>

    </header>


    <main class="friends-page">

        <section class="friends-header">

            <p class="section-label">
                APEX SOCIAL
            </p>

            <h1>Friends</h1>

            <p>
                Find players and build your Apex Games friends list.
            </p>

        </section>


        <section class="friend-search-card">

            <div class="search-copy">

                <h2>Find a Player</h2>

                <p>
                    Search using their Apex Games gamertag.
                </p>

            </div>


            <form id="friendSearchForm">

                <input
                    type="text"
                    id="friendSearchInput"
                    placeholder="Enter gamertag"
                    autocomplete="off"
                    maxlength="20"
                >

                <button type="submit">
                    Search
                </button>

            </form>

        </section>


        <section
            class="search-results"
            id="searchResults"
        >

            <p class="empty-results">
                Search for a player to get started.
            </p>

        </section>
        <section class="requests-section">

    <div class="section-heading">
        <div>
            <p class="section-label">
                REQUESTS
            </p>

            <h2>Incoming Friend Requests</h2>
        </div>
    </div>

    <div id="incomingRequests">

        <p class="empty-results">
            Loading friend requests...
        </p>

    </div>

</section>


        <div
            class="friends-message"
            id="friendsMessage"
        ></div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="account-state.js"></script>
    <script src="friends.js?v=1"></script>

</body>

</html>
