<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | Apex Games
    </title>

    <link
        rel="stylesheet"
        href="forgot-password.css?v=1"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <p class="eyebrow">
                APEX GAMES
            </p>

            <h1>
                Create New Password
            </h1>

            <p class="description">
                Enter a new password for
                your Apex Games account.
            </p>

            <form id="resetPasswordForm">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="submit"
                    id="resetButton"
                >
                    Reset Password
                </button>

            </form>

            <p
                id="formMessage"
                class="form-message"
            >
                Verifying reset link...
            </p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="reset-password.js?v=1"></script>

</body>

</html>
