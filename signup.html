<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Apex Games</title>

    <link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="account.css">
</head>

<body>

    <!-- NAVIGATION -->

   <header class="topbar">

    <div class="nav-left">

        <a href="index.html" class="brand">
            <img src="apex-logo.png" alt="Apex Games">
        </a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="library.html">Library</a>
            <a href="chat.html">Chat</a>
            <a href="store.html">Store</a>
            <a href="news.html">News</a>
            <a href="about.html">About</a>
        </nav>

    </div>


    <form class="nav-search" id="navSearch">

        <span class="search-icon">⌕</span>

        <input
            type="search"
            id="navSearchInput"
            placeholder="Search Apex Games"
            autocomplete="off"
            aria-label="Search Apex Games"
        >

    </form>


    <div class="nav-account">

        <div class="logged-out-account">

            <a href="login.html" class="login-link">
                Log In
            </a>

        </div>

    </div>

</header>

    <!-- CREATE ACCOUNT -->

    <main class="account-page">

        <section class="account-box">

            <div class="account-heading">

                <p class="account-label">
                    APEX GAMES ACCOUNT
                </p>

                <h1>Create Account</h1>

                <p>
                    One account for Apex Games, your Library,
                    ratings, and connected Apex experiences.
                </p>

            </div>


            <form id="signupForm">

                <div class="form-group">

<label for="gamertag">
    GAMERTAG
</label>

<input
    type="text"
    id="gamertag"
    autocomplete="username"
    placeholder="Choose your gamertag"
    minlength="3"
    maxlength="20"
    required
>
                    <div class="form-group">

    <label for="displayName">
        DISPLAY NAME
    </label>

    <input
        type="text"
        id="displayName"
        autocomplete="name"
        placeholder="Your display name"
        maxlength="32"
        required
    >

</div>

                </div>


                <div class="form-group">

                    <label for="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        placeholder="Enter your password again"
                        minlength="8"
                        required
                    >

                </div>


                <p class="form-message" id="formMessage"></p>


                <button type="submit" class="account-submit">
                    CREATE ACCOUNT
                </button>

            </form>


            <div class="account-bottom">

                <p>
                    Already have an Apex Games account?
                </p>

                <a href="login.html">
                    Log In
                </a>

            </div>

        </section>

    </main>


 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="signup.js"></script>

</body>

</html>
